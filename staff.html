<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Moon Auto Detailing — Crew</title>
<link rel="icon" href="/NewLogoColor.png" type="image/png" />
<link rel="apple-touch-icon" href="/NewLogoColor.png" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MAD Crew" />
<meta name="robots" content="noindex" />
<style>
:root {
  --moon-primary: #7fb8e6;
  --moon-primary-dark: #4f95cf;
  --panel: rgba(111,147,196,0.14);
  --line: rgba(255,255,255,0.15);
  --muted: rgba(255,255,255,0.65);
  --ok: #6fd39a;
  --warn: #ffc65c;
  --bad: #ff6b6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: #0e0e0e;
  color: white;
  min-height: 100vh;
  padding: 0 0 calc(76px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent;
}
a { color: var(--moon-primary); }
header.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: rgba(14,14,14,0.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
header.top img { width: 38px; }
header.top .who { flex: 1; min-width: 0; }
header.top .who strong { display: block; color: var(--moon-primary); font-size: 15px; }
header.top .who span { font-size: 12px; color: var(--muted); }
main { padding: 14px 16px; max-width: 680px; margin: 0 auto; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex;
  background: #121417;
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; padding: 12px 0 14px; border: none; background: none; color: var(--muted);
  font-size: 12px; font-weight: 600; cursor: pointer; min-width: 0;
}
nav.tabs button.active { color: var(--moon-primary); }
nav.tabs button .ico { display: flex; justify-content: center; height: 24px; margin-bottom: 2px; }
.ui-icon { display: inline-block; vertical-align: -0.2em; flex: none; }
.banner { display: flex; gap: 8px; align-items: flex-start; }
.btn .ui-icon { margin-right: 2px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255,255,255,0.06);
  color: white; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn.primary { background: var(--moon-primary); border-color: var(--moon-primary); color: #07111d; }
.btn.block { width: 100%; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.panel {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  padding: 14px; margin-bottom: 12px;
}
.panel h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.panel h3 .count { margin-left: auto; font-size: 13px; font-weight: 600; }
.muted { color: var(--muted); }
.banner {
  border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-weight: 600;
  background: rgba(255,198,92,0.14); border: 1px solid rgba(255,198,92,0.5); color: var(--warn);
}
.daynav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.daynav .label { flex: 1; text-align: center; font-weight: 700; }
.job {
  display: block; width: 100%; text-align: left; color: white; cursor: pointer;
  border: 1px solid var(--line); border-left: 4px solid var(--moon-primary);
  border-radius: 14px; background: var(--panel); padding: 12px 14px; margin-bottom: 10px; font: inherit;
}
.job.done { border-left-color: var(--ok); opacity: 0.8; }
.job.ceramic { border-left-color: var(--warn); }
.job .time { font-size: 13px; color: var(--moon-primary); font-weight: 700; }
.job .name { font-size: 17px; font-weight: 700; margin: 2px 0; }
.job .line { font-size: 14px; color: var(--muted); }
.chip {
  display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: rgba(255,255,255,0.1); margin-right: 4px;
}
.chip.ok { background: rgba(111,211,154,0.18); color: var(--ok); }
.chip.warn { background: rgba(255,198,92,0.18); color: var(--warn); }
.chip.info { background: rgba(127,184,230,0.18); color: var(--moon-primary); }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 14px; }
.kv .k { color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.note { white-space: pre-wrap; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px; font-size: 14px; }
.note.crew { background: rgba(255,198,92,0.12); border: 1px solid rgba(255,198,92,0.35); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.photos .ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; }
.photos .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .ph button {
  position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0;
  border: none; background: none; color: white; cursor: pointer;
  display: flex; align-items: flex-start; justify-content: flex-end;
}
.photos .ph button span {
  display: flex; align-items: center; justify-content: center; margin: 5px;
  width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.75);
}
.photo-add { margin-top: 10px; min-height: 48px; }
/* on-page confirm sheet (sheetConfirm) — window.confirm() is blocked by some browsers */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-card { width: 100%; max-width: 440px; background: #1b222b; border: 1px solid var(--line); border-radius: 16px; padding: 18px; font-size: 16px; line-height: 1.45; }
.sheet-card p { margin: 0 0 16px; }
.sheet-actions { display: flex; gap: 10px; }
.sheet-actions .btn { flex: 1; min-height: 48px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #1d0505; }
.photos .ph.uploading { display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
.step {
  display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px;
  border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 15px; cursor: pointer;
}
.step:last-child { border-bottom: none; }
.step input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--moon-primary); flex: none; }
.step.done span { color: var(--muted); text-decoration: line-through; }
.scope { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--moon-primary); margin: 12px 0 2px; }
.scope:first-child { margin-top: 0; }
label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
input.in, select.in, textarea.in {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.08); color: white; font-size: 16px; font-family: inherit;
}
select.in option { color: black; }
.problems { margin: 0 0 10px; padding-left: 18px; color: var(--warn); font-size: 14px; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 20;
  padding: 12px 14px; border-radius: 12px; background: #1e2a36; border: 1px solid var(--line);
  font-size: 14px; text-align: center;
}
.toast.error { background: #3a1d1d; border-color: rgba(255,107,107,0.5); }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.daygroup { font-weight: 700; margin: 16px 0 8px; color: var(--moon-primary); }
.daygroup:first-child { margin-top: 0; }
.clock { border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--panel); }
.clock.on { border-color: rgba(111,211,154,0.6); background: rgba(111,211,154,0.10); }
.clock .row1 { display: flex; align-items: center; gap: 10px; }
.clock .state { flex: 1; }
.clock .state strong { display: block; font-size: 17px; }
.clock .state span { font-size: 13px; color: var(--muted); }
.clock .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); flex: none; }
.clock.on .dot { background: var(--ok); box-shadow: 0 0 0 4px rgba(111,211,154,0.2); }
.clock .pin { display: flex; gap: 8px; margin-top: 12px; }
.clock .pin input { flex: 1; letter-spacing: 0.3em; text-align: center; }
.clock .why { margin-top: 10px; font-size: 13px; color: var(--warn); }
.shift { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 14px;
  background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.18); }
.shift.mine { background: rgba(127,184,230,0.14); border: 1px solid rgba(127,184,230,0.5); }
.shift strong { color: var(--moon-primary); }
.avrow { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
.avrow:last-child { border-bottom: none; }
.avrow .day { font-weight: 700; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; padding: 8px 4px; border: none; background: none; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--moon-primary); color: #07111d; }
.times { grid-column: 2; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.times input { flex: 1; min-width: 0; padding: 8px; font-size: 15px; }
.item { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.07); font-size: 14px; }
.item:last-child { border-bottom: none; }
.item .grow { flex: 1; }
.row2 { display: flex; gap: 8px; }
.row2 > * { flex: 1; min-width: 0; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wkd { border-radius: 10px; padding: 7px 2px; text-align: center; font-size: 11px; background: rgba(255,255,255,0.05); }
.wkd b { display: block; font-size: 12px; }
.wkd span { color: var(--muted); }
.wkd.yes { background: rgba(111,211,154,0.16); }
.wkd.yes span { color: var(--ok); }
.wkd.no { background: rgba(255,107,107,0.12); }
.wkd.no span { color: var(--bad); }
.linkbtn { background: none; border: none; color: var(--moon-primary); font: inherit; font-size: 13px; padding: 4px 0; cursor: pointer; text-align: left; }
.times-link { grid-column: 2; }
.chip.bad { background: rgba(255,107,107,0.18); color: var(--bad); }
form.mini { margin-top: 8px; padding-top: 4px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <img src="/NewLogoColor.png" alt="" />
  <div class="who"><strong id="name">Loading…</strong><span>Moon Auto Detailing crew</span></div>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="today" class="active"><span class="ico" data-icon="car"></span>Jobs</button>
  <button type="button" data-tab="schedule"><span class="ico" data-icon="calendar"></span>Schedule</button>
  <button type="button" data-tab="availability"><span class="ico" data-icon="clock"></span>Availability</button>
  <button type="button" data-tab="expenses"><span class="ico" data-icon="receipt"></span>Expenses</button>
  <button type="button" data-tab="account"><span class="ico" data-icon="user"></span>Me</button>
</nav>

<!-- No capture attribute: phones offer Take Photo or the photo library, and several can be picked at once. -->
<input type="file" id="photoInput" accept="image/*" multiple class="hidden" />

<script type="module">
import { icon } from "/ui-icons.js";
document.querySelectorAll("[data-icon]").forEach((el) => { el.innerHTML = icon(el.dataset.icon, 22); });
// Crew app. All data comes from /api/staff-* with the x-staff-session header; the token
// lives in localStorage so the crew stays signed in on their phone (12-hour sessions).
const TOKEN_KEY = "moon_staff_session";
let token = null;
try { token = localStorage.getItem(TOKEN_KEY); } catch {}

const app = document.getElementById("app");
const state = { me: null, tab: "today", date: null, today: null, job: null, saveTimer: null };

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (n == null ? "—" : "$" + Number(n).toFixed(2));
const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" });
const dayLabel = (d) => new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const serviceName = (j) => j.service_category ? `${j.service_category.replace(/ Detail$/, "")} · Level ${j.service_level || 1}` : "Service";
const SCOPE_LABEL = { general: "Arrival & handoff", interior: "Interior", exterior: "Exterior", ceramic: "Ceramic coating" };

function signOut() {
  try { localStorage.removeItem(TOKEN_KEY); } catch {}
  window.location.replace("/staff-login.html");
}

async function api(url, options = {}) {
  options.headers = { ...(options.headers || {}), "x-staff-session": token };
  if (options.body && typeof options.body !== "string") {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(options.body);
  }
  const res = await fetch(url, options);
  if (res.status === 401) { signOut(); throw new Error("Signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "Something went wrong");
    err.data = data;
    throw err;
  }
  return data;
}

let toastTimer = null;
function toast(message, isError) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = message;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), isError ? 6000 : 3000);
}

// On-page confirmation; resolves true when the action is tapped, false on Cancel or a tap outside.
function sheetConfirm(message, { okLabel = "Confirm", danger = false } = {}) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "sheet";
    wrap.innerHTML = `<div class="sheet-card" role="alertdialog" aria-modal="true"><p>${esc(message)}</p>
      <div class="sheet-actions"><button type="button" class="btn" data-no>Cancel</button><button type="button" class="btn ${danger ? "danger" : "primary"}" data-yes>${esc(okLabel)}</button></div></div>`;
    const done = (v) => { wrap.remove(); resolve(v); };
    wrap.addEventListener("click", (e) => { if (e.target === wrap) done(false); });
    wrap.querySelector("[data-no]").onclick = () => done(false);
    wrap.querySelector("[data-yes]").onclick = () => done(true);
    document.body.appendChild(wrap);
  });
}

function setTab(tab) {
  state.tab = tab;
  state.job = null;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  render();
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

function render() {
  window.scrollTo(0, 0);
  if (state.job) return renderJob();
  if (state.tab === "today") return renderDay();
  if (state.tab === "schedule") return renderSchedule();
  if (state.tab === "availability") return renderAvailability();
  if (state.tab === "expenses") return renderExpenses();
  return renderAccount();
}

/* ---------------- Jobs (one day) ---------------- */

function jobCard(j) {
  const done = j.status === "completed";
  const started = !done && j.started_at;
  const status = done ? `<span class="chip ok">Done</span>` : started ? `<span class="chip info">In progress</span>` : "";
  const ceramic = j.job_flag === "ceramic" ? `<span class="chip warn">Ceramic</span>` : "";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "job" + (done ? " done" : "") + (j.job_flag === "ceramic" ? " ceramic" : "");
  btn.innerHTML = `
    <div class="time">${esc(timeOf(j.scheduled_start))} – ${esc(timeOf(j.scheduled_end))}</div>
    <div class="name">${esc(j.customer_name)}</div>
    <div class="line">${esc(serviceName(j))}${j.vehicle ? " · " + esc(j.vehicle) : ""}</div>
    <div class="line">${esc(j.service_address || "")}</div>
    <div style="margin-top:6px;">${status}${ceramic}${j.crew_notes ? `<span class="chip warn">Crew note</span>` : ""}</div>`;
  btn.onclick = () => openJob(j.id);
  return btn;
}

async function renderDay() {
  const date = state.date || state.today;
  app.innerHTML = `
    <div class="daynav">
      <button class="btn small" id="prevDay" type="button" aria-label="Previous day">${icon("chevronLeft", 16)}</button>
      <div class="label">${date ? esc(date === state.today ? "Today · " + dayLabel(date) : dayLabel(date)) : "Today"}</div>
      <button class="btn small" id="nextDay" type="button" aria-label="Next day">${icon("chevronRight", 16)}</button>
    </div>
    <div id="clockCard"></div>
    <div id="dayBody"><div class="empty">Loading jobs…</div></div>`;
  loadClock();
  const go = (n) => { state.date = addDays(date || state.today, n); renderDay(); };
  app.querySelector("#prevDay").onclick = () => go(-1);
  app.querySelector("#nextDay").onclick = () => go(1);

  try {
    const data = await api(`/api/staff-jobs${date ? "?date=" + date : ""}`);
    state.today = data.today;
    if (!state.date) state.date = data.date;
    app.querySelector(".daynav .label").textContent = data.date === data.today ? "Today · " + dayLabel(data.date) : dayLabel(data.date);
    const body = app.querySelector("#dayBody");
    body.innerHTML = "";
    if (data.ceramic_today) {
      body.insertAdjacentHTML("beforeend", `<div class="banner">${icon("sparkle", 18)} Ceramic coating on this day — bring the coating kit, panel prep and lights, and plan for cure time.</div>`);
    }
    if (!data.jobs.length) {
      body.insertAdjacentHTML("beforeend", `<div class="empty">No jobs scheduled.</div>`);
      return;
    }
    const done = data.jobs.filter((j) => j.status === "completed").length;
    body.insertAdjacentHTML("beforeend", `<p class="muted" style="margin:0 0 10px;font-size:14px;">${data.jobs.length} job${data.jobs.length === 1 ? "" : "s"} · ${done} done</p>`);
    data.jobs.forEach((j) => body.appendChild(jobCard(j)));
  } catch (err) {
    app.querySelector("#dayBody").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

/* ---------------- time clock ---------------- */
// Clock-in is verified by GPS (near one of today's jobs or the base). Away from those, a
// manager types their PIN on this phone. Clock-out records location but never blocks.

let clockState = null;
let clockTicker = null;

const fmtDuration = (ms) => {
  const m = Math.max(0, Math.floor(ms / 60000));
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
};

function getPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
    );
  });
}

async function loadClock() {
  try {
    clockState = await api("/api/staff-clock");
    renderClock();
  } catch (err) {
    const el = document.getElementById("clockCard");
    if (el) el.innerHTML = `<div class="clock"><span class="muted">Time clock unavailable: ${esc(err.message)}</span></div>`;
  }
}

function renderClock(extra = {}) {
  const el = document.getElementById("clockCard");
  if (!el || !clockState) return;
  const open = clockState.open_entry;
  const since = open ? new Date(open.clock_in_at) : null;
  const weekHours = clockState.week?.hours ?? 0;
  el.innerHTML = `
    <div class="clock ${open ? "on" : ""}">
      <div class="row1">
        <div class="dot"></div>
        <div class="state">
          <strong>${open ? "On the clock" : "Off the clock"}</strong>
          <span>${open
            ? `Since ${esc(timeOf(open.clock_in_at))} · <span data-elapsed>${fmtDuration(Date.now() - since)}</span>`
            : "Clock in when you arrive at your first job"} · ${weekHours.toFixed(2)} hrs this week</span>
        </div>
        <button class="btn ${open ? "" : "primary"}" type="button" data-clock>${open ? "Clock out" : "Clock in"}</button>
      </div>
      ${extra.why ? `<div class="why">${esc(extra.why)}</div>` : ""}
      ${extra.needsPin ? `
        <form class="pin" data-pin-form>
          <input class="in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="Manager PIN" autocomplete="off" required />
          <button class="btn primary" type="submit">Approve</button>
        </form>` : ""}
    </div>`;
  el.querySelector("[data-clock]").onclick = () => (open ? clockOut() : clockIn());
  el.querySelector("[data-pin-form]")?.addEventListener("submit", (e) => {
    e.preventDefault();
    clockIn(e.target.querySelector("input").value, extra.position);
  });

  clearInterval(clockTicker);
  if (open) {
    clockTicker = setInterval(() => {
      const span = document.querySelector("#clockCard [data-elapsed]");
      if (!span) return clearInterval(clockTicker);
      span.textContent = fmtDuration(Date.now() - since);
    }, 30000);
  }
}

async function clockIn(pin, knownPosition) {
  const btn = document.querySelector("#clockCard [data-clock]");
  if (btn) { btn.disabled = true; btn.textContent = "Locating…"; }
  const position = knownPosition || (await getPosition());
  try {
    clockState = await api("/api/staff-clock", { method: "POST", body: { action: "in", ...(position || {}), pin: pin || undefined } });
    renderClock();
    toast(clockState.verify_method === "pin" ? "Clocked in (manager approved)." : "Clocked in. Have a good day!");
  } catch (err) {
    if (err.data?.needs_pin) {
      renderClock({ needsPin: true, why: err.message + (position ? "" : " Turn on Location for this site in your browser settings to clock in by GPS."), position });
      document.querySelector("#clockCard [data-pin-form] input")?.focus();
    } else {
      toast(err.message, true);
      renderClock();
    }
  }
}

async function clockOut() {
  if (!(await sheetConfirm("Clock out now?", { okLabel: "Clock out" }))) return;
  const btn = document.querySelector("#clockCard [data-clock]");
  if (btn) { btn.disabled = true; btn.textContent = "Clocking out…"; }
  const position = await getPosition();
  try {
    clockState = await api("/api/staff-clock", { method: "POST", body: { action: "out", ...(position || {}) } });
    renderClock();
    toast("Clocked out. Thanks!");
  } catch (err) {
    toast(err.message, true);
    loadClock();
  }
}

/* ---------------- Schedule (next 14 days) ---------------- */

const fmt12 = (t) => {
  const [h, m] = String(t).split(":").map(Number);
  return `${((h + 11) % 12) + 1}${m ? ":" + String(m).padStart(2, "0") : ""}${h >= 12 ? "pm" : "am"}`;
};

async function renderSchedule() {
  app.innerHTML = `<div class="empty">Loading schedule…</div>`;
  try {
    const [data, sh] = await Promise.all([api("/api/staff-jobs?upcoming=14"), api("/api/staff-shifts?days=14")]);
    const nyDay = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" });
    const days = [...new Set([...sh.shifts.map((s) => s.shift_date), ...data.jobs.map((j) => nyDay(j.scheduled_start))])].sort();
    const myShifts = sh.shifts.filter((s) => s.mine).length;
    app.innerHTML = `<p class="muted" style="margin:0 0 12px;font-size:14px;">Next 14 days · you have ${myShifts} shift${myShifts === 1 ? "" : "s"}. Tap a job for details.</p>`;
    if (!days.length) {
      app.insertAdjacentHTML("beforeend", `<div class="empty">No shifts or jobs in the next two weeks yet.</div>`);
      return;
    }
    for (const day of days) {
      const dayJobs = data.jobs.filter((j) => nyDay(j.scheduled_start) === day);
      const dayShifts = sh.shifts.filter((s) => s.shift_date === day).sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0));
      const ceramic = dayJobs.some((j) => j.job_flag === "ceramic");
      app.insertAdjacentHTML("beforeend", `<div class="daygroup">${esc(day === data.today ? "Today" : dayLabel(day))}${ceramic ? ' <span class="chip warn">Ceramic</span>' : ""}</div>`);
      for (const s of dayShifts) {
        app.insertAdjacentHTML("beforeend", `<div class="shift ${s.mine ? "mine" : ""}">${s.mine ? "<strong>Your shift</strong>" : esc(s.full_name)} · ${esc(fmt12(s.start_time))} – ${esc(fmt12(s.end_time))}${s.notes ? ` <span class="muted">· ${esc(s.notes)}</span>` : ""}</div>`);
      }
      if (!dayShifts.some((s) => s.mine) && dayJobs.length) {
        app.insertAdjacentHTML("beforeend", `<p class="muted" style="margin:0 0 8px;font-size:13px;">You're not scheduled this day.</p>`);
      }
      dayJobs.forEach((j) => app.appendChild(jobCard(j)));
    }
  } catch (err) {
    app.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

/* ---------------- Availability ---------------- */
// The usual week is asked for once, then shown as a one-line summary with an Edit button.
// One-day changes and time off live behind small "+" buttons; only one form is open at a time.

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const avState = { editingWeek: false, openForm: null, armed: null };

async function renderAvailability() {
  app.innerHTML = `<div class="empty">Loading availability…</div>`;
  let data;
  try { data = await api("/api/staff-availability"); } catch (err) { app.innerHTML = `<div class="empty">${esc(err.message)}</div>`; return; }
  avState.openForm = null;
  avState.armed = null;
  avState.editingWeek = !data.weekly.some((w) => w.set);
  drawAvailability(data);
}

function weekSummaryHtml(weekly) {
  return `<div class="wk">${WEEK_ORDER.map((d) => {
    const w = weekly[d];
    const cls = !w.set ? "unset" : w.available ? "yes" : "no";
    const sub = !w.set ? "—" : !w.available ? "Off" : w.start_time || w.end_time ? `${w.start_time ? fmt12(w.start_time) : "…"}–${w.end_time ? fmt12(w.end_time) : "…"}` : "All day";
    return `<div class="wkd ${cls}"><b>${DAY_NAMES[d].slice(0, 3)}</b><span>${esc(sub)}</span></div>`;
  }).join("")}</div>`;
}

function drawAvailability(data) {
  const weekly = data.weekly.map((w) => ({ ...w, hours: !!(w.start_time || w.end_time) }));
  const statusLabel = { approved: "Approved", denied: "Denied", pending: "Waiting for approval" };
  const firstTime = !data.weekly.some((w) => w.set);

  // Upcoming changes: one-day changes and time off together, by date.
  const items = [
    ...data.exceptions.map((e) => ({ kind: "ex", date: e.on_date, e })),
    ...data.time_off.filter((t) => t.end_date >= data.today).map((t) => ({ kind: "off", date: t.start_date, t })),
  ].sort((a, b) => (a.date < b.date ? -1 : 1));

  const itemHtml = (it) => {
    if (it.kind === "ex") {
      const e = it.e;
      const what = e.available ? (e.start_time || e.end_time ? `Can work ${fmt12(e.start_time || "00:00")}–${fmt12(e.end_time || "23:59")}` : "Can work all day") : "Can't work";
      return `<div class="item"><div class="grow"><strong>${esc(dayLabel(e.on_date))}</strong><br><span class="muted">${esc(what)}${e.note ? " · " + esc(e.note) : ""}</span></div>
        <button class="btn small" type="button" data-del-ex="${esc(e.id)}">${avState.armed === "ex" + e.id ? "Remove?" : icon("x", 16)}</button></div>`;
    }
    const t = it.t;
    return `<div class="item"><div class="grow"><strong>Time off · ${esc(dayLabel(t.start_date))}${t.end_date !== t.start_date ? " – " + esc(dayLabel(t.end_date)) : ""}</strong><br>
      <span class="chip ${t.status === "approved" ? "ok" : t.status === "denied" ? "bad" : "warn"}">${esc(statusLabel[t.status] || t.status)}</span>
      ${t.reason ? `<span class="muted">${esc(t.reason)}</span>` : ""}${t.review_note ? `<br><span class="muted">Manager: ${esc(t.review_note)}</span>` : ""}</div>
      ${t.status === "pending" ? `<button class="btn small" type="button" data-cancel-off="${esc(t.id)}">${avState.armed === "off" + t.id ? "Cancel request?" : icon("x", 16)}</button>` : ""}</div>`;
  };

  const forms = {
    cant: `<form class="mini" data-form="cant">
        <label class="field">Day you can't work</label>
        <input class="in" type="date" name="on_date" min="${esc(data.today)}" required />
        <input class="in" name="note" placeholder="Reason (optional)" style="margin-top:8px;" />
        <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button></div>
      </form>`,
    can: `<form class="mini" data-form="can">
        <label class="field">Extra day you can work</label>
        <input class="in" type="date" name="on_date" min="${esc(data.today)}" required />
        <div class="row2" style="margin-top:8px;"><input class="in" type="time" name="start_time" aria-label="From (optional)" /><input class="in" type="time" name="end_time" aria-label="Until (optional)" /></div>
        <p class="muted" style="margin:6px 0 0;font-size:12px;">Leave the times empty if you can work all day.</p>
        <div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button></div>
      </form>`,
    off: `<form class="mini" data-form="off">
        <label class="field">Time off</label>
        <div class="row2"><input class="in" type="date" name="start_date" min="${esc(data.today)}" required aria-label="From" /><input class="in" type="date" name="end_date" min="${esc(data.today)}" aria-label="To (optional)" /></div>
        <p class="muted" style="margin:6px 0 0;font-size:12px;">Leave the second date empty for a single day.</p>
        <input class="in" name="reason" placeholder="Reason (optional)" style="margin-top:8px;" />
        <div class="actions"><button class="btn primary" type="submit">Send request</button><button class="btn" type="button" data-close>Cancel</button></div>
      </form>`,
  };

  app.innerHTML = `
    <div class="panel">
      <h3>My usual week ${!avState.editingWeek ? `<button class="btn small" type="button" id="editWeek" style="margin-left:auto;">Edit</button>` : ""}</h3>
      ${avState.editingWeek ? `
        ${firstTime ? `<p class="muted" style="margin:0 0 8px;font-size:14px;">Set this once — tap each day you can usually work. Managers see it when they build the schedule. You can change it anytime.</p>` : ""}
        <div id="weekly">${WEEK_ORDER.map((d) => {
          const w = weekly[d];
          return `<div class="avrow" data-day="${d}">
            <div class="day">${DAY_NAMES[d].slice(0, 3)}</div>
            <div class="seg">
              <button type="button" data-set="yes" class="${w.available === true ? "on" : ""}">Can work</button>
              <button type="button" data-set="no" class="${w.available === false ? "on" : ""}">Off</button>
            </div>
            <div class="times-link ${w.available === true ? "" : "hidden"}">
              ${w.hours
                ? `<div class="times"><input class="in" type="time" data-start value="${esc(w.start_time || "")}" aria-label="From" /> to <input class="in" type="time" data-end value="${esc(w.end_time || "")}" aria-label="Until" /></div>`
                : `<button type="button" class="linkbtn" data-hours>All day · set hours</button>`}
            </div>
          </div>`;
        }).join("")}</div>
        <div class="actions">
          <button class="btn primary" type="button" id="saveWeekly">Save my week</button>
          ${firstTime ? "" : `<button class="btn" type="button" id="cancelWeek">Cancel</button>`}
        </div>`
        : weekSummaryHtml(weekly)}
    </div>

    <div class="panel">
      <h3>Changes & time off</h3>
      ${items.length ? items.map(itemHtml).join("") : `<p class="muted" style="margin:0 0 4px;font-size:14px;">Nothing coming up.</p>`}
      ${avState.openForm ? forms[avState.openForm] : `
        <div class="actions">
          <button class="btn small" type="button" data-open="cant">+ Can't work a day</button>
          <button class="btn small" type="button" data-open="can">+ Extra day I can work</button>
          <button class="btn small" type="button" data-open="off">+ Request time off</button>
        </div>`}
    </div>`;

  const redraw = () => drawAvailability(data);
  const apply = (next) => { data = next; avState.openForm = null; avState.armed = null; drawAvailability(data); };

  app.querySelector("#editWeek")?.addEventListener("click", () => { avState.editingWeek = true; redraw(); });
  app.querySelector("#cancelWeek")?.addEventListener("click", () => { avState.editingWeek = false; redraw(); });

  app.querySelectorAll(".avrow").forEach((row) => {
    const d = Number(row.dataset.day);
    row.querySelectorAll("[data-set]").forEach((b) => (b.onclick = () => {
      weekly[d].available = b.dataset.set === "yes";
      row.querySelectorAll("[data-set]").forEach((x) => x.classList.toggle("on", x === b));
      row.querySelector(".times-link").classList.toggle("hidden", !weekly[d].available);
    }));
    row.querySelector("[data-hours]")?.addEventListener("click", () => {
      captureTimes();
      weekly[d].hours = true;
      weekly[d].start_time = weekly[d].start_time || "08:00";
      weekly[d].end_time = weekly[d].end_time || "17:00";
      data = { ...data, weekly };
      redraw();
    });
  });

  // Keeps typed hours when the list redraws.
  function captureTimes() {
    app.querySelectorAll(".avrow").forEach((row) => {
      const w = weekly[Number(row.dataset.day)];
      const s = row.querySelector("[data-start]");
      const e = row.querySelector("[data-end]");
      if (s) w.start_time = s.value || null;
      if (e) w.end_time = e.value || null;
    });
  }

  app.querySelector("#saveWeekly")?.addEventListener("click", async () => {
    captureTimes();
    if (!weekly.some((w) => w.available !== null)) { toast("Tap Can work or Off for at least one day.", true); return; }
    const payload = weekly.map((w) => ({
      weekday: w.weekday,
      available: w.available,
      start_time: w.available && w.hours ? w.start_time || null : null,
      end_time: w.available && w.hours ? w.end_time || null : null,
    }));
    try {
      const next = await api("/api/staff-availability", { method: "PUT", body: { weekly: payload } });
      avState.editingWeek = false;
      toast("Your week is saved.");
      apply(next);
    } catch (err) { toast(err.message, true); }
  });

  app.querySelectorAll("[data-open]").forEach((b) => (b.onclick = () => { avState.openForm = b.dataset.open; redraw(); app.querySelector("[data-form] input")?.focus(); }));
  app.querySelector("[data-close]")?.addEventListener("click", () => { avState.openForm = null; redraw(); });

  app.querySelector("[data-form]")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const kind = e.target.dataset.form;
    const f = Object.fromEntries(new FormData(e.target).entries());
    const body = kind === "off"
      ? { kind: "time_off", start_date: f.start_date, end_date: f.end_date || f.start_date, reason: f.reason }
      : { kind: "exception", on_date: f.on_date, available: kind === "can", start_time: f.start_time || null, end_time: f.end_time || null, note: f.note };
    try {
      const next = await api("/api/staff-availability", { method: "POST", body });
      toast(kind === "off" ? "Time off requested. A manager will review it." : "Saved.");
      apply(next);
    } catch (err) { toast(err.message, true); }
  });

  app.querySelectorAll("[data-del-ex]").forEach((b) => (b.onclick = async () => {
    const key = "ex" + b.dataset.delEx;
    if (avState.armed !== key) { avState.armed = key; redraw(); return; }
    try { apply(await api(`/api/staff-availability?exception_id=${encodeURIComponent(b.dataset.delEx)}`, { method: "DELETE" })); }
    catch (err) { toast(err.message, true); }
  }));
  app.querySelectorAll("[data-cancel-off]").forEach((b) => (b.onclick = async () => {
    const key = "off" + b.dataset.cancelOff;
    if (avState.armed !== key) { avState.armed = key; redraw(); return; }
    try { apply(await api(`/api/staff-availability?time_off_id=${encodeURIComponent(b.dataset.cancelOff)}`, { method: "DELETE" })); }
    catch (err) { toast(err.message, true); }
  }));
}

/* ---------------- Expenses (receipts) ---------------- */
// Snap the receipt first, then a short form. Managers approve; money you spent yourself is
// paid back on payroll.

const exState = { photo: null, preview: null, armed: null, data: null };

async function renderExpenses() {
  app.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    exState.data = await api("/api/staff-expenses");
    drawExpenses();
  } catch (err) {
    app.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

function drawExpenses() {
  const d = exState.data;
  const statusChip = (e) => e.status === "approved"
    ? `<span class="chip ok">Approved</span>`
    : e.status === "rejected" ? `<span class="chip bad">Rejected</span>` : `<span class="chip warn">Waiting for approval</span>`;
  const payback = (e) => !e.reimburse ? "" : e.reimbursed_at
    ? `<span class="muted"> · paid back</span>`
    : e.status === "approved" ? `<span class="muted"> · you'll be paid back on payroll</span>` : "";

  app.innerHTML = `
    ${exState.photo ? `
      <form class="panel" id="expForm">
        <h3>New expense</h3>
        <img src="${exState.preview}" alt="Receipt" style="width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#000;" />
        <div class="actions" style="margin-top:6px;"><button class="btn small" type="button" id="retake">Retake photo</button></div>
        <label class="field">Total on the receipt</label>
        <input class="in" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required style="font-size:22px;font-weight:700;" />
        <label class="field">Store</label>
        <input class="in" name="vendor" placeholder="e.g. AutoZone, Shell, Chemical Guys" required />
        <label class="field">What was it for?</label>
        <select class="in" name="category" required>
          <option value="">Choose…</option>
          ${d.categories.map((c) => `<option>${esc(c)}</option>`).join("")}
        </select>
        <label class="field">How did you pay?</label>
        <div class="seg" id="paidWith">${d.paid_with.map((p) => `<button type="button" data-paid="${esc(p.key)}">${esc(p.label.replace(" — pay me back", ""))}</button>`).join("")}</div>
        <p class="muted" id="paidHint" style="margin:6px 0 0;font-size:12px;">Choose "My own money" if you paid personally — you'll be paid back on payroll.</p>
        <div class="row2" style="margin-top:4px;">
          <div><label class="field">Receipt date</label><input class="in" name="expense_date" type="date" value="${esc(d.today)}" max="${esc(d.today)}" required /></div>
        </div>
        <label class="field">Note (optional)</label>
        <input class="in" name="description" placeholder="e.g. 2 gal APC for the Lee job" />
        <div class="actions">
          <button class="btn primary" type="submit" style="flex:1;">Submit expense</button>
          <button class="btn" type="button" id="cancelExp">Cancel</button>
        </div>
      </form>` : `
      <button class="btn primary block" type="button" id="snap" style="padding:16px;font-size:17px;margin-bottom:12px;">${icon("camera", 20)} Add a receipt</button>`}
    <div class="panel">
      <h3>My expenses <span class="count muted">last 90 days</span></h3>
      ${d.expenses.length ? d.expenses.map((e) => `
        <div class="item">
          ${e.receipt_url ? `<a href="${esc(e.receipt_url)}" target="_blank" rel="noopener" style="flex:0 0 48px;height:48px;border-radius:8px;overflow:hidden;background:#222;display:block;"><img src="${esc(e.receipt_url)}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.replaceWith(document.createTextNode('PDF'))"></a>` : ""}
          <div class="grow"><strong>${money(e.amount)} · ${esc(e.vendor)}</strong><br>
            <span class="muted">${esc(dayLabel(e.expense_date))} · ${esc(e.category)}</span><br>
            ${statusChip(e)}${payback(e)}${e.review_note ? `<br><span class="muted">Manager: ${esc(e.review_note)}</span>` : ""}</div>
          ${e.status === "pending" ? `<button class="btn small" type="button" data-withdraw="${esc(e.id)}">${exState.armed === e.id ? "Withdraw?" : icon("x", 16)}</button>` : ""}
        </div>`).join("") : `<p class="muted" style="margin:0;font-size:14px;">No expenses yet. Tap “Add a receipt” after you buy supplies, fuel or equipment.</p>`}
    </div>`;

  app.querySelector("#snap")?.addEventListener("click", () => pickReceipt());
  app.querySelector("#retake")?.addEventListener("click", () => pickReceipt());
  app.querySelector("#cancelExp")?.addEventListener("click", () => { clearReceipt(); drawExpenses(); });

  let paidWith = null;
  app.querySelectorAll("[data-paid]").forEach((b) => (b.onclick = () => {
    paidWith = b.dataset.paid;
    app.querySelectorAll("[data-paid]").forEach((x) => x.classList.toggle("on", x === b));
  }));

  app.querySelector("#expForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!paidWith) { toast("Choose how you paid.", true); return; }
    const f = Object.fromEntries(new FormData(e.target).entries());
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = "Uploading receipt…";
    try {
      const signed = await api("/api/receipt-upload-url", { method: "POST", body: { content_type: exState.photo.type } });
      await putToSignedUrl(signed.upload_url, exState.photo.blob, exState.photo.type);
      btn.textContent = "Submitting…";
      exState.data = await api("/api/staff-expenses", { method: "POST", body: { ...f, paid_with: paidWith, receipt_path: signed.path } });
      clearReceipt();
      toast("Expense submitted for approval.");
      drawExpenses();
    } catch (err) {
      toast(err.message, true);
      btn.disabled = false;
      btn.textContent = "Submit expense";
    }
  });

  app.querySelectorAll("[data-withdraw]").forEach((b) => (b.onclick = async () => {
    if (exState.armed !== b.dataset.withdraw) { exState.armed = b.dataset.withdraw; drawExpenses(); return; }
    try {
      exState.data = await api(`/api/staff-expenses?id=${encodeURIComponent(b.dataset.withdraw)}`, { method: "DELETE" });
      exState.armed = null;
      drawExpenses();
    } catch (err) { toast(err.message, true); }
  }));
}

function clearReceipt() {
  if (exState.preview) URL.revokeObjectURL(exState.preview);
  exState.photo = null;
  exState.preview = null;
}

const receiptInput = document.createElement("input");
receiptInput.type = "file";
receiptInput.accept = "image/*";
receiptInput.capture = "environment";
receiptInput.className = "hidden";
document.body.appendChild(receiptInput);
function pickReceipt() {
  receiptInput.value = "";
  receiptInput.click();
}
receiptInput.onchange = async () => {
  const file = receiptInput.files[0];
  if (!file) return;
  const photo = await compressImage(file);
  clearReceipt();
  exState.photo = photo;
  exState.preview = URL.createObjectURL(photo.blob);
  drawExpenses();
  app.querySelector('#expForm [name="amount"]')?.focus();
};

    <button class="btn block" id="signOutBtn" type="button">Sign out</button>`;
  app.querySelector("#signOutBtn").onclick = signOut;
  loadPay();
  app.querySelector("#pwForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api("/api/staff-me", { method: "POST", body: { current_password: f.get("current"), new_password: f.get("next") } });
      e.target.reset();
      toast("Password changed.");
    } catch (err) { toast(err.message, true); }
  };
}

// Pay: this week so far and last week are estimates until a manager approves payroll.
async function loadPay() {
  const el = document.getElementById("payPanel");
  if (!el) return;
  try {
    const p = await api("/api/staff-pay");
    const fmtD = (d) => new Date(d + "T12:00:00Z").toLocaleDateString([], { timeZone: "UTC", month: "short", day: "numeric" });
    const week = (w, title) => {
      const hours = Number(w.regular_hours) + Number(w.overtime_hours);
      const tag = w.status === "paid" ? '<span class="chip ok">Paid</span>' : w.status === "approved" ? '<span class="chip info">Approved</span>' : '<span class="chip">Estimate</span>';
      return `<div class="item"><div class="grow"><strong>${title}</strong> <span class="muted">${esc(fmtD(w.start))}–${esc(fmtD(w.end))}</span><br>
        <span class="muted">${hours.toFixed(2)} hrs${Number(w.overtime_hours) ? ` (${Number(w.overtime_hours).toFixed(2)} overtime)` : ""}${Number(w.tips) ? ` · tips ${money(w.tips)}` : ""}${Number(w.reimbursements) ? ` · pay-backs ${money(w.reimbursements)}` : ""}</span></div>
        <div style="text-align:right;"><strong style="font-size:18px;">${money(w.total)}</strong><br>${tag}</div></div>`;
    };
    el.innerHTML = `
      <h3>My pay ${p.rate != null ? `<span class="count muted">${money(p.rate)}/hr</span>` : ""}</h3>
      ${p.rate == null ? `<p class="muted" style="margin:0 0 6px;font-size:13px;">Your hourly rate hasn't been set yet — ask a manager.</p>` : ""}
      ${week(p.this_week, "This week")}
      ${week(p.last_week, "Last week")}
      ${p.history.filter((h) => h.start !== p.last_week.start).slice(0, 6).map((h) => week(h, "Week of")).join("")}
      <p class="muted" style="margin:8px 0 0;font-size:12px;">Hours come from the time clock; overtime over 40 hrs is 1.5×. Tips are shared with the crew on each job. Paid weekly.</p>`;
  } catch (err) {
    el.innerHTML = `<h3>My pay</h3><p class="muted" style="margin:0;">${esc(err.message)}</p>`;
  }
}

/* ---------------- One job ---------------- */

async function openJob(id) {
  state.job = { id, loading: true };
  app.innerHTML = `<div class="empty">Loading job…</div>`;
  window.scrollTo(0, 0);
  try {
    const data = await api(`/api/staff-job?id=${encodeURIComponent(id)}`);
    state.job = { id, ...data, pendingUploads: 0 };
    renderJob();
  } catch (err) {
    state.job = null;
    toast(err.message, true);
    render();
  }
}

function localProblems(J) {
  const problems = [];
  const missing = J.checklist.filter((s) => s.required && !J.checked[s.id]).length;
  if (missing) problems.push(`${missing} checklist step${missing === 1 ? "" : "s"} not checked off`);
  for (const kind of ["before", "after"]) {
    const have = J.photos.filter((p) => p.kind === kind).length;
    const need = J.min_photos[kind] - have;
    if (need > 0) problems.push(`${need} more ${kind} photo${need === 1 ? "" : "s"} needed (minimum ${J.min_photos[kind]})`);
  }
  if (J.pendingUploads) problems.push("Wait for photos to finish uploading");
  return problems;
}

function photoSection(J, kind, title, hint) {
  const list = J.photos.filter((p) => p.kind === kind);
  const min = J.min_photos[kind];
  const done = J.job.status === "completed";
  const countHtml = min ? `<span class="count ${list.length >= min ? "" : "muted"}">${list.length}/${min}${list.length >= min ? " " + icon("check", 14) : ""}</span>` : `<span class="count muted">${list.length}</span>`;
  return `
    <div class="panel" data-photos="${kind}">
      <h3>${esc(title)} ${countHtml}</h3>
      ${hint ? `<p class="muted" style="margin:0 0 8px;font-size:13px;">${esc(hint)}</p>` : ""}
      <div class="photos">
        ${list.map((p) => `<div class="ph"><img src="${esc(p.url || "")}" alt="" loading="lazy" />${!done && p.mine ? `<button type="button" data-del="${esc(p.id)}" aria-label="Remove photo"><span>${icon("x", 16)}</span></button>` : ""}</div>`).join("")}
        ${Array.from({ length: J.uploading?.[kind] || 0 }).map(() => `<div class="ph uploading">Uploading…</div>`).join("")}
      </div>
      ${done ? "" : `<button class="btn block photo-add" type="button" data-add="${kind}">${icon("camera", 18)} Add ${kind === "issue" ? "damage" : kind} photos</button>`}
    </div>`;
}

function renderJob() {
  const J = state.job;
  const j = J.job;
  const done = j.status === "completed";
  const started = !!J.work?.started_at;
  const mapsUrl = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(j.service_address || "");
  const phone = (j.customer_phone || "").replace(/[^\d+]/g, "");

  // General steps come first (arrival) and last (steps numbered 90+), so the second run
  // gets its own heading instead of repeating "Arrival & handoff".
  let lastScope = null;
  const seenScopes = new Set();
  const checklistHtml = J.checklist.map((s) => {
    const label = s.scope === "general" && seenScopes.has("general") ? "Before you leave" : SCOPE_LABEL[s.scope] || s.scope;
    const head = s.scope !== lastScope ? `<div class="scope">${esc(label)}</div>` : "";
    lastScope = s.scope;
    seenScopes.add(s.scope);
    const on = !!J.checked[s.id];
    return `${head}<label class="step ${on ? "done" : ""}"><input type="checkbox" data-step="${esc(s.id)}" ${on ? "checked" : ""} ${done ? "disabled" : ""} /><span>${esc(s.text)}${s.required ? "" : ' <span class="muted">(optional)</span>'}</span></label>`;
  }).join("");

  const problems = localProblems(J);
  const crewHtml = J.crew.filter((c) => c.role !== "owner" || c.id === J.me).map((c) => {
    const isMe = c.id === J.me;
    const on = isMe || J.worked_by.includes(c.id) || (!J.worked_by.length && c.role === "employee");
    return `<label class="step"><input type="checkbox" data-crew="${esc(c.id)}" ${on ? "checked" : ""} ${isMe ? "disabled" : ""} /><span>${esc(c.full_name)}${isMe ? " (you)" : ""}</span></label>`;
  }).join("");

  app.innerHTML = `
    <button class="btn small" id="backBtn" type="button" style="margin-bottom:12px;">${icon("chevronLeft", 16)} Back to jobs</button>
    ${j.job_flag === "ceramic" ? `<div class="banner">${icon("sparkle", 18)} Ceramic coating job — follow the coating steps exactly and keep the car dry for the cure time.</div>` : ""}
    <div class="panel">
      <div class="job-head">
        <div class="muted" style="font-size:13px;font-weight:700;color:var(--moon-primary);">${esc(timeOf(j.scheduled_start))} – ${esc(timeOf(j.scheduled_end))}${j.duration_minutes ? ` · ~${Math.round(j.duration_minutes / 6) / 10} hrs` : ""}</div>
        <h2 style="margin:2px 0 6px;font-size:21px;">${esc(j.customer_name)}</h2>
        <div>${done ? '<span class="chip ok">Completed</span>' : started ? '<span class="chip info">In progress</span>' : '<span class="chip">Not started</span>'}</div>
      </div>
      <div class="kv" style="margin-top:12px;">
        <div class="k">Service</div><div>${esc(serviceName(j))}</div>
        <div class="k">Vehicle</div><div>${esc(j.vehicle || "—")}${j.vehicle_size ? ` <span class="muted">(${esc(j.vehicle_size)})</span>` : ""}${j.license_plate ? `<br><span class="muted">Plate ${esc(j.license_plate)}</span>` : ""}</div>
        <div class="k">Address</div><div>${esc(j.service_address || "—")}</div>
        <div class="k">Collect</div><div><strong>${money(j.amount_to_collect)}</strong></div>
      </div>
      <div class="actions">
        <a class="btn small" href="${esc(mapsUrl)}" target="_blank" rel="noopener">${icon("navigate", 15)} Directions</a>
        ${phone ? `<a class="btn small" href="tel:${esc(phone)}">${icon("phone", 15)} Call</a><a class="btn small" href="sms:${esc(phone)}">${icon("message", 15)} Text</a>` : ""}
      </div>
    </div>
    ${j.crew_notes ? `<div class="panel"><h3>Crew notes</h3><div class="note crew">${esc(j.crew_notes)}</div></div>` : ""}
    ${j.customer_notes ? `<div class="panel"><h3>Customer notes</h3><div class="note">${esc(j.customer_notes)}</div></div>` : ""}

    ${!done && !started ? `<button class="btn primary block" id="startBtn" type="button" style="margin-bottom:12px;">Start job</button>` : ""}

    ${photoSection(J, "before", "1 · Before photos", `Before you touch the car: all four sides plus the interior${J.min_photos.before ? ` (at least ${J.min_photos.before})` : ""}.`)}
    ${photoSection(J, "issue", "Damage / issues (if any)", "Scratches, dents, stains or anything already wrong — protects you and the business.")}
    <div class="panel">
      <h3>2 · Checklist <span class="count">${J.checklist.filter((s) => J.checked[s.id]).length}/${J.checklist.length}</span></h3>
      ${checklistHtml || '<p class="muted" style="margin:0;">No checklist for this service.</p>'}
    </div>
    ${photoSection(J, "after", "3 · After photos", `Same angles as the before photos, once the job is finished${J.min_photos.after ? ` (at least ${J.min_photos.after})` : ""}.`)}

    ${done ? `<div class="panel"><h3>${icon("check", 18)} Job completed</h3><p class="muted" style="margin:0;">Payment recorded and the customer has been emailed.</p></div>` : `
    <form class="panel" id="completeForm">
      <h3>4 · Payment & complete</h3>
      <label class="field">Amount collected</label>
      <input class="in" name="amount_collected" type="number" inputmode="decimal" min="0" step="0.01" value="${j.amount_to_collect ?? ""}" required />
      <label class="field">Tip</label>
      <input class="in" name="tip_amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
      <label class="field">Payment method</label>
      <select class="in" name="payment_method" required>
        <option value="">Choose…</option><option>Cash</option><option>Venmo</option><option>PayPal</option><option>Check</option>
      </select>
      <label class="field">Notes (optional)</label>
      <textarea class="in" name="payment_notes" rows="2"></textarea>
      <label class="field">Who worked this job</label>
      <div>${crewHtml}</div>
      <div style="margin-top:14px;">
        ${problems.length ? `<ul class="problems">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
        <button class="btn primary block" type="submit" ${problems.length ? "disabled" : ""}>Complete job</button>
      </div>
    </form>`}`;

  app.querySelector("#backBtn").onclick = () => { state.job = null; render(); };
  app.querySelector("#startBtn")?.addEventListener("click", startJob);
  app.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => pickPhotos(b.dataset.add)));
  app.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => deletePhoto(b.dataset.del)));
  app.querySelectorAll("[data-step]").forEach((cb) => (cb.onchange = () => {
    if (cb.checked) J.checked[cb.dataset.step] = true;
    else delete J.checked[cb.dataset.step];
    cb.closest(".step").classList.toggle("done", cb.checked);
    saveChecklistSoon();
    refreshCompleteState();
  }));
  app.querySelector("#completeForm")?.addEventListener("submit", submitComplete);
}

// Updates the checklist counter and the complete button without redrawing (keeps form input).
function refreshCompleteState() {
  const J = state.job;
  const form = app.querySelector("#completeForm");
  const counter = [...app.querySelectorAll(".panel h3")].find((h) => h.textContent.includes("Checklist"))?.querySelector(".count");
  if (counter) counter.textContent = `${J.checklist.filter((s) => J.checked[s.id]).length}/${J.checklist.length}`;
  if (!form) return;
  const problems = localProblems(J);
  form.querySelector(".problems")?.remove();
  const btn = form.querySelector('button[type="submit"]');
  if (problems.length) btn.insertAdjacentHTML("beforebegin", `<ul class="problems">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`);
  btn.disabled = problems.length > 0;
}

function saveChecklistSoon() {
  clearTimeout(state.saveTimer);
  const J = state.job;
  state.saveTimer = setTimeout(async () => {
    try {
      await api("/api/staff-job", { method: "POST", body: { id: J.id, action: "checklist", checklist: J.checked } });
      if (!J.work) J.work = { started_at: new Date().toISOString() };
    } catch (err) { toast("Checklist not saved: " + err.message, true); }
  }, 700);
}

async function startJob() {
  try {
    const data = await api("/api/staff-job", { method: "POST", body: { id: state.job.id, action: "start" } });
    state.job = { id: state.job.id, ...data, pendingUploads: 0 };
    renderJob();
    toast("Job started. Take your before photos first.");
  } catch (err) { toast(err.message, true); }
}

/* ---------------- photos ---------------- */

const photoInput = document.getElementById("photoInput");
let photoKind = null;
function pickPhotos(kind) {
  photoKind = kind;
  photoInput.value = "";
  photoInput.click();
}
photoInput.onchange = () => {
  const files = [...photoInput.files];
  if (files.length && photoKind) files.forEach((f) => uploadPhoto(photoKind, f));
};

// Shrinks phone photos (often 4–12 MB) to ~1600px JPEG before upload. Falls back to the
// original file if the browser can't decode it (e.g. HEIC outside Safari).
async function compressImage(file) {
  try {
    const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.8));
    if (blob) return { blob, type: "image/jpeg" };
  } catch {}
  return { blob: file, type: file.type || "image/jpeg" };
}

async function putToSignedUrl(url, blob, type) {
  let res = await fetch(url, { method: "PUT", headers: { "Content-Type": type, "x-upsert": "false" }, body: blob });
  if (!res.ok) {
    // Storage also accepts the multipart form supabase-js sends.
    const form = new FormData();
    form.append("cacheControl", "3600");
    form.append("", blob);
    res = await fetch(url, { method: "PUT", headers: { "x-upsert": "false" }, body: form });
  }
  if (!res.ok) throw new Error("Upload failed (" + res.status + ")");
}

async function uploadPhoto(kind, file) {
  const J = state.job;
  if (!J) return;
  J.uploading = J.uploading || {};
  J.uploading[kind] = (J.uploading[kind] || 0) + 1;
  J.pendingUploads++;
  renderJobKeepingForm();
  try {
    const { blob, type } = await compressImage(file);
    const signed = await api("/api/staff-job-photo", { method: "POST", body: { action: "sign", booking_id: J.id, kind, content_type: type } });
    await putToSignedUrl(signed.upload_url, blob, type);
    const { photo } = await api("/api/staff-job-photo", { method: "POST", body: { action: "confirm", booking_id: J.id, kind, path: signed.path } });
    if (state.job === J) J.photos.push(photo);
    if (!J.work) J.work = { started_at: new Date().toISOString() };
  } catch (err) {
    toast("Photo not saved: " + err.message, true);
  } finally {
    J.uploading[kind]--;
    J.pendingUploads--;
    if (state.job === J) renderJobKeepingForm();
  }
}

async function deletePhoto(id) {
  if (!(await sheetConfirm("Remove this photo?", { okLabel: "Remove", danger: true }))) return;
  try {
    await api(`/api/staff-job-photo?id=${encodeURIComponent(id)}`, { method: "DELETE" });
    state.job.photos = state.job.photos.filter((p) => p.id !== id);
    renderJobKeepingForm();
  } catch (err) { toast(err.message, true); }
}

// Redraws the job but keeps whatever was typed into the payment form and the scroll position.
function renderJobKeepingForm() {
  const form = app.querySelector("#completeForm");
  const saved = form ? Object.fromEntries(new FormData(form).entries()) : null;
  const crew = form ? [...form.querySelectorAll("[data-crew]")].filter((c) => c.checked).map((c) => c.dataset.crew) : null;
  const y = window.scrollY;
  if (crew) state.job.worked_by = crew;
  renderJob();
  const again = app.querySelector("#completeForm");
  if (again && saved) for (const [k, v] of Object.entries(saved)) if (again.elements[k]) again.elements[k].value = v;
  window.scrollTo(0, y);
}

/* ---------------- complete ---------------- */

async function submitComplete(e) {
  e.preventDefault();
  const J = state.job;
  const form = e.target;
  const f = Object.fromEntries(new FormData(form).entries());
  const workedBy = [...form.querySelectorAll("[data-crew]")].filter((c) => c.checked).map((c) => c.dataset.crew);
  const amount = Number(f.amount_collected);
  if (J.job.amount_to_collect != null && amount < J.job.amount_to_collect &&
      !(await sheetConfirm(`You entered ${money(amount)}, but the job total is ${money(J.job.amount_to_collect)}. Complete anyway?`, { okLabel: "Complete anyway" }))) return;
  if (!(await sheetConfirm("Complete this job? The customer will get their completion email.", { okLabel: "Complete job" }))) return;

  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.textContent = "Completing…";
  try {
    await api("/api/staff-complete-job", {
      method: "POST",
      body: { booking_id: J.id, checklist: J.checked, worked_by: workedBy, ...f },
    });
    toast("Job completed. Nice work!");
    await openJob(J.id);
  } catch (err) {
    const extra = err.data?.problems?.length ? ": " + err.data.problems.join("; ") : "";
    toast(err.message + extra, true);
    btn.disabled = false;
    btn.textContent = "Complete job";
  }
}

/* ---------------- boot ---------------- */

if (!token) {
  signOut();
} else {
  try {
    const { staff } = await api("/api/staff-me");
    if (staff.must_change_password) signOut(); // finish first sign-in on the sign-in page
    state.me = staff;
    document.getElementById("name").textContent = staff.full_name;
    render();
  } catch (err) {
    app.innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}
</script>
